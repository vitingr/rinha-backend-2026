# Rinha de Backend 2026 — Fraud Detection via Vector Search
# Stack: Go 1.25.5 + nginx
#
# Resource budget: 1.0 CPU / 350 MB total
#   nginx : 0.10 CPU / 30 MB
#   api1  : 0.45 CPU / 155 MB
#   api2  : 0.45 CPU / 155 MB
#   total : 1.00 CPU / 340 MB  (10 MB headroom)
networks:
  rinha:
    driver: bridge

services:

  # Load balancer
  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    networks:
      - rinha
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"
    restart: unless-stopped

  api1:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      PORT: "9999"
      REFERENCES_PATH: "/app/resources/references.json.gz"
      GOGC: "80"
      GOMEMLIMIT: "130MiB"
      GOMAXPROCS: "2"
    networks:
      - rinha
    expose:
      - "9999"
    healthcheck:
      # test: ["CMD-SHELL", "wget -qO- http://localhost:9999/ready || exit 1"]
      test: ["CMD", "/fraud-api", "health"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "155MB"
    restart: unless-stopped

  api2:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      PORT: "9999"
      REFERENCES_PATH: "/app/resources/references.json.gz"
      GOGC: "80"
      GOMEMLIMIT: "130MiB"
      GOMAXPROCS: "2"
    networks:
      - rinha
    expose:
      - "9999"
    healthcheck:
      # test: ["CMD-SHELL", "wget -qO- http://localhost:9999/ready || exit 1"]
      test: ["CMD", "/fraud-api", "health"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "155MB"
    restart: unless-stopped
