volumes:
  sockets:

networks:
  rinha:
    driver: bridge

services:
  haproxy:
    image: haproxy:3.3
    container_name: rinha-haproxy
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - sockets:/sockets
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "30MB"

  api1:
    image: vitingr/rinha-backend-2026:latest
    environment:
      - PORT=8080
      - INSTANCE_ID=1
    volumes:
      - sockets:/sockets
    healthcheck:
      test: [ "CMD-SHELL", "sleep 5 && exit 0" ]
      interval: 5s
      timeout: 10s
      retries: 1
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: "160MB"

  api2:
    image: vitingr/rinha-backend-2026:latest
    environment:
      - PORT=8080
      - INSTANCE_ID=2
    volumes:
      - sockets:/sockets
    healthcheck:
      test: [ "CMD-SHELL", "sleep 5 && exit 0" ]
      interval: 5s
      timeout: 10s
      retries: 1
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: "160MB"
    