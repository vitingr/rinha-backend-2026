volumes:
  sockets:

networks:
  rinha:
    driver: bridge

services:
  haproxy:
    image: haproxy:3.3
    container_name: rinha-haproxy
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - sockets:/tmp/sockets
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "30MB"

  api1:
    image: vitingr/rinha-backend-2026:1.0
    environment:
      - PORT=8080
      - INSTANCE_ID=1
    volumes:
      - sockets:/tmp/sockets
    healthcheck:
      test: ["CMD-SHELL", "test -S /tmp/sockets/api1.sock"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: "160MB"

  api2:
    image: vitingr/rinha-backend-2026:1.0
    environment:
      - PORT=8080
      - INSTANCE_ID=2
    volumes:
      - sockets:/tmp/sockets
    healthcheck:
      test: ["CMD-SHELL", "test -S /tmp/sockets/api2.sock"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: "160MB"
    