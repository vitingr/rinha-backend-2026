networks:
  rinha:
    driver: bridge

services:
  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./sockets:/tmp/sockets
    ports:
      - "9999:9999"
    networks:
      - rinha
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"
    restart: unless-stopped

  api1:
    image: vitingr/rinha-backend-2026:latest
    environment:
      PORT: "/tmp/sockets/api1.sock"
      REFERENCES_PATH: "/app/resources/references.json.gz"
      GOGC: "1000"
      GOMEMLIMIT: "130MiB"
      GOMAXPROCS: "1"
    volumes:
      - ./sockets:/tmp/sockets
    networks:
      - rinha
    healthcheck:
      test: ["CMD", "/fraud-api", "health"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "155MB"
    restart: unless-stopped

  api2:
    image: vitingr/rinha-backend-2026:latest
    environment:
      PORT: "/tmp/sockets/api2.sock"
      REFERENCES_PATH: "/app/resources/references.json.gz"
      GOGC: "1000"
      GOMEMLIMIT: "130MiB"
      GOMAXPROCS: "1"
    volumes:
      - ./sockets:/tmp/sockets
    networks:
      - rinha
    healthcheck:
      test: ["CMD", "/fraud-api", "health"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "155MB"
    restart: unless-stopped
    