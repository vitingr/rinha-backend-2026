# Minimal, high-throughput nginx config for Rinha de Backend 2026
# Responsibilities: round-robin load balance only. No business logic.

user  nginx;

# One worker per CPU core available to the container
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    # epoll is the most efficient event model on Linux
    use                  epoll;
    worker_connections   4096;
    multi_accept         on;
}

http {
    upstream api_backend {
        least_conn;# least-connections is better than pure RR under variable load
        server api1:9999;
        server api2:9999;
        keepalive 64;# keep persistent connections to upstreams
        keepalive_requests 10000;
        keepalive_timeout  60s;
    }

    # Performance tuning
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;

    # Disable access log - saves I/O on the hot path
    access_log          off;

    # No mime/content negotiation needed - our API is always JSON
    default_type        application/json;

    # Reduce header overhead
    server_tokens       off;

    # Timeout tuning
    keepalive_timeout           65;
    keepalive_requests          100000;
    proxy_connect_timeout       1s;
    proxy_send_timeout          5s;
    proxy_read_timeout          5s;

    # Disable proxy buffering - we want to stream responses immediately
    proxy_buffering             off;
    proxy_request_buffering     off;

    # Buffer just enough for request headers
    client_header_buffer_size   1k;
    large_client_header_buffers 4 4k;
    client_body_buffer_size     16k;

    # Server
    server {
        listen 9999 reuseport;
        server_name _;

        location /fraud-score {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";# enable upstream keepalive
            proxy_set_header   Host              $host;
        }

        location /ready {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
        }

        # Catch-all: reject anything else quickly
        location / {
            return 404;
        }
    }
}
